name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag push creates only the git tag, not a GitHub Release object.
  # taiki-e/upload-rust-binary-action uploads assets to an existing release,
  # so create it first (idempotent) before the upload matrix fans out.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # aarch64-unknown-linux-gnu is intentionally omitted: the action does
          # not install its std component (E0463 "can't find crate for core").
          # aarch64-unknown-linux-musl below covers 64-bit ARM Linux and is a
          # portable static binary.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mcp-google-ads
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
